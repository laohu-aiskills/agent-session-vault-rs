[workspace]
resolver = "2"
members = ["crates/asv-core", "crates/asv-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
chrono = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
